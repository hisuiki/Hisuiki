name: Deploy hisuiki to Cloud Run

# Builds the React frontend and Express API into one image, then deploys that same image to two
# Cloud Run services. APP_ROLE — set by Terraform on each service, not here — decides which half a
# revision serves: hisuiki.com runs it as the frontend, api.hisuiki.com runs it as the API.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version.json is baked into the bundle, so the bump must precede the build and a later
      # failure still leaves one pushed. Rebase before pushing so a re-run or an overlapping push
      # doesn't fail the deploy on a non-fast-forward.
      - name: Bump build number
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          FILE=public/version.json
          VERSION=$(jq -r '.version' "$FILE")
          BUILD=$(( $(jq -r '.build' "$FILE") + 1 ))
          jq --arg v "$VERSION" --argjson b "$BUILD" '.version = $v | .build = $b' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          git commit -am "chore: bump build number to $BUILD [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # API_BASE_URL is baked into the bundle at build time, so the frontend has to be told the
      # API's hostname here — it can no longer assume its own origin.
      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/containers/hisuiki:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --build-arg VITE_ASSET_BASE_URL="${{ vars.ASSET_BASE_URL }}" \
            -f server/Dockerfile \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Image only, to both services. Terraform owns each service's environment and runtime
      # identity, including the APP_ROLE that decides which half it serves.
      #
      # The API goes first: a frontend revision calling an API that has not been updated yet is the
      # recoverable order, whereas the reverse can serve a bundle expecting routes that do not exist.
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ vars.GCP_API_SERVICE }} \
            --container app \
            --image "${{ steps.image.outputs.image }}" \
            --container pgbouncer \
            --image "${{ steps.image.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ${{ vars.GCP_WEB_SERVICE }} \
            --container app \
            --image "${{ steps.image.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet

      # The frontend backend caches on origin headers, so hashed assets stay immutable and the SPA
      # shell is revalidated. Invalidating all paths makes a new shell visible immediately. The API
      # has no CDN in front of it at all, so nothing there needs purging.
      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.GCP_URL_MAP }} \
            --path "/*" --async

      # Skipped rather than failed when the credentials are absent: the zone moved with the domain,
      # and a deploy that succeeded everywhere else should not be reported as broken because the
      # edge cache in front of it was not purged.
      - name: Purge Cloudflare cache
        env:
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE" ] || [ -z "$TOKEN" ]; then
            echo "No Cloudflare credentials configured — skipping purge."
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail
