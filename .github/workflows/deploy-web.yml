name: Deploy hisuiki to Cloud Run

# Builds the React frontend and Express API into one image, then deploys that same image to two
# Cloud Run services. APP_ROLE — set by Terraform on each service, not here — decides which half a
# revision serves: hisuiki.com runs it as the frontend, api.hisuiki.com runs it as the API.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      sync_github_oauth:
        description: Copy the stored GitHub OAuth credential into Google Secret Manager
        required: false
        default: false
        type: boolean
      sync_google_oauth:
        description: Copy the stored Google OAuth credential into Google Secret Manager
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version.json is baked into the bundle, so the bump must precede the build and a later
      # failure still leaves one pushed. Rebase before pushing so a re-run or an overlapping push
      # doesn't fail the deploy on a non-fast-forward.
      - name: Bump build number
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          FILE=public/version.json
          VERSION=$(jq -r '.version' "$FILE")
          BUILD=$(( $(jq -r '.build' "$FILE") + 1 ))
          jq --arg v "$VERSION" --argjson b "$BUILD" '.version = $v | .build = $b' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          git commit -am "chore: bump build number to $BUILD [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Repository secrets are write-only, so this manual path is the safe bridge when an OAuth
      # credential already exists in Actions but Secret Manager needs a new version. The deployer
      # may add versions to these two secrets; it cannot read them back or change other secrets.
      - name: Sync OAuth credentials
        if: inputs.sync_github_oauth || inputs.sync_google_oauth
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_API_SERVICE: ${{ vars.GCP_API_SERVICE }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.sync_github_oauth }}" = "true" ]; then
            if [ -z "$GITHUB_OAUTH_CLIENT_ID" ] || [ -z "$GITHUB_OAUTH_CLIENT_SECRET" ]; then
              echo "GitHub OAuth repository secrets are not configured."
              exit 1
            fi
            printf '%s' "$GITHUB_OAUTH_CLIENT_SECRET" | \
              gcloud secrets versions add github-oauth-client-secret \
                --data-file=- --project="$GCP_PROJECT_ID"
            gcloud run services update "$GCP_API_SERVICE" \
              --region="$GCP_REGION" \
              --update-env-vars="GITHUB_CLIENT_ID=$GITHUB_OAUTH_CLIENT_ID" \
              --quiet
          fi

          if [ "${{ inputs.sync_google_oauth }}" = "true" ]; then
            if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ] || [ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
              echo "Google OAuth repository secrets are not configured."
              exit 1
            fi
            printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | \
              gcloud secrets versions add google-oauth-client-secret \
                --data-file=- --project="$GCP_PROJECT_ID"
            gcloud run services update "$GCP_API_SERVICE" \
              --region="$GCP_REGION" \
              --update-env-vars="GOOGLE_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID" \
              --quiet
          fi

      # Keep local and automated deployments on one implementation. The script builds the bundle
      # with these public origins, pushes one image, resolves it to an immutable digest, deploys the
      # API before the frontend, and invalidates the frontend CDN cache.
      - name: Build and deploy image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_API_SERVICE: ${{ vars.GCP_API_SERVICE }}
          GCP_WEB_SERVICE: ${{ vars.GCP_WEB_SERVICE }}
          GCP_URL_MAP: ${{ vars.GCP_URL_MAP }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
        # The push-triggered build bump creates a new local commit, so tag the image with HEAD rather
        # than github.sha (which still names the commit that triggered the workflow).
        run: scripts/build-and-deploy-gcp.sh --tag "$(git rev-parse HEAD)"

      # Skipped rather than failed when the credentials are absent: the zone moved with the domain,
      # and a deploy that succeeded everywhere else should not be reported as broken because the
      # edge cache in front of it was not purged.
      - name: Purge Cloudflare cache
        env:
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE" ] || [ -z "$TOKEN" ]; then
            echo "No Cloudflare credentials configured — skipping purge."
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail
