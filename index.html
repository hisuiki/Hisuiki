<!DOCTYPE html>
<!-- The inline background is the pre-stylesheet flash guard and the macOS overscroll color, so it
     has to match app.scss's own `html` background-color rather than fight it: at #121212 it also
     overrode the base the fallback wallpaper is screen-blended against, which is what mutes it. -->
<html lang="en" style="background-color: #322c58;">

<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <meta name="viewport"
          content="width=device-width, user-scalable=yes, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Hisuiki is a platform for creating and sharing board experiences made from images, words, media, and widgets." />
    <meta name="keywords" content="Hisuiki, photo sharing, photos, blogging, blog, writing, media platform, community" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://hisuiki.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hisuiki.com" />
    <meta property="og:site_name" content="Hisuiki" />
    <meta property="og:title" content="Hisuiki — Photos &amp; Writing" />
    <meta property="og:description" content="Create and share board experiences made from images, words, media, and widgets." />
    <meta property="og:image" content="https://cdn.hisuiki.com/static/logo_nwrks.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hisuiki.com/" />
    <meta name="twitter:title" content="Hisuiki" />
    <meta name="twitter:description" content="A multi-user platform." />
    <meta name="twitter:image" content="https://cdn.hisuiki.com/static/logo_nwrks.png" />

    <title>Hisuiki — Photos &amp; Writing</title>

</head>

<!-- No background on body, deliberately: app.scss keeps it transparent so the wallpaper painted on
     the html canvas stays visible. An inline color here beats that rule and paints an opaque slab
     over the canvas, which buried the fallback photo and left .main-footer's backdrop-filter with a
     flat color to blur — i.e. no frosted glass at all until today's photo had loaded. -->
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="app">
        <!-- Static skeleton shown until the bundle boots — matches the real app chrome.
             React replaces it wholesale when it mounts into #app. -->
        <div class="sk-shell">
            <header class="sk-header">
                <div class="sk-header-inner">
                    <div class="sk-pivot">
                        <span class="skeleton sk-nav-item" style="width:5.5rem"></span>
                        <span class="skeleton sk-nav-item" style="width:5rem"></span>
                        <span class="skeleton sk-nav-item" style="width:7.5rem"></span>
                        <span class="skeleton sk-nav-item" style="width:8.5rem"></span>
                    </div>
                    <span class="skeleton sk-avatar-tile"></span>
                </div>
            </header>

            <div class="sk-body">
                <div class="sk-content">
                    <div class="sk-meta-row">
                        <span class="skeleton skeleton-meta" style="width:120px"></span>
                        <span class="skeleton skeleton-meta" style="width:80px"></span>
                    </div>
                    <span class="skeleton skeleton-title" style="width:60%"></span>
                    <span class="skeleton skeleton-title" style="width:40%"></span>
                    <span class="skeleton skeleton-line" style="width:100%"></span>
                    <span class="skeleton skeleton-line" style="width:92%"></span>
                    <span class="skeleton skeleton-line" style="width:96%"></span>
                    <span class="skeleton skeleton-line" style="width:80%"></span>
                    <span class="skeleton skeleton-line" style="width:88%"></span>
                    <span class="skeleton skeleton-line" style="width:70%"></span>
                </div>
            </div>

            <footer class="sk-footer">
                <div class="sk-footer-inner">
                    <div class="sk-footer-left">
                        <span class="skeleton sk-footer-logo"></span>
                        <span class="skeleton sk-footer-copy"></span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script type="module" src="/src/Main.tsx"></script>
</body>

</html>
