# Production-shaped stack, for testing the real image locally.
#
#   docker compose up --build
#
#   http://localhost:8080   the frontend, served by the production image in its "web" role
#   http://localhost:8081   the API, the same image in its "api" role
#
# This mirrors production's split: one image, two services, two origins — which means it also
# reproduces the parts that only bite when the frontend and API are not same-origin, namely CORS and
# the session cookie. Development (docker-compose.dev.yml) proxies through Vite and hides both.
#
# VITE_API_BASE_URL is a build argument rather than an environment variable because the frontend
# bundle bakes it in at build time; changing it means rebuilding the image, exactly as in CI.

name: hisuiki

x-app-build: &app-build
  context: .
  dockerfile: server/Dockerfile
  args:
    VITE_API_BASE_URL: http://localhost:8081
    VITE_ASSET_BASE_URL: http://localhost:4444/storage/v1/b/hisuiki-assets-prod/o

services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hisuiki
      POSTGRES_USER: hisuiki
      POSTGRES_PASSWORD: hisuiki
    # 5433 on the host: the dev stack already binds 5432, and running both at once should not be a
    # port fight.
    ports:
      - "0.0.0.0:5433:5432"
    volumes:
      # /var/lib/postgresql, not .../data: Postgres 18 images keep data in a
      # major-version subdirectory so `pg_upgrade --link` can work across a mount boundary,
      # and refuse to start when the older path is mounted instead.
      - postgres-prod-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisuiki -d hisuiki"]
      interval: 5s
      timeout: 3s
      retries: 20

  gcs:
    restart: unless-stopped
    image: fsouza/fake-gcs-server:1.52
    command:
      - -scheme=http
      - -port=4443
      - -public-host=gcs:4443
      - -data=/data
    ports:
      - "0.0.0.0:4444:4443"
    volumes:
      - ./.local/gcs:/data

  pgbouncer:
    restart: unless-stopped
    image: hisuiki-app:local
    build: *app-build
    command: ["/usr/local/bin/PgBouncerEntrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBOUNCER_DATABASE_HOST: postgres
      PGBOUNCER_DATABASE_NAME: hisuiki
      PGBOUNCER_DATABASE_USER: hisuiki
      PGBOUNCER_DATABASE_PASSWORD: hisuiki
      # Four backend connections per bouncer are enough for the production instance size. Client
      # connections queue here instead of multiplying into one PostgreSQL process each.
      PGBOUNCER_DEFAULT_POOL_SIZE: 4
      PGBOUNCER_RESERVE_POOL_SIZE: 1
      PGBOUNCER_MAX_CLIENT_CONN: 100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const s=require('net').connect(6432,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    image: hisuiki-app:local
    build: *app-build
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      gcs:
        condition: service_started
    ports:
      - "0.0.0.0:8081:8080"
    environment:
      APP_ROLE: api
      PORT: 8080
      DATABASE_URL: postgresql://hisuiki:hisuiki@pgbouncer:6432/hisuiki
      # Prisma CLI commands use this direct route and never run schema changes through a
      # transaction-pooling connection.
      DIRECT_DATABASE_URL: postgresql://hisuiki:hisuiki@postgres:5432/hisuiki
      GCS_BUCKET: hisuiki-assets-prod
      GCS_PREFIX: static
      # User-authored content: post bodies and uploaded media, kept apart from the site's own assets.
      GCS_DATA_BUCKET: hisuiki-data-prod
      GCS_API_ENDPOINT: http://gcs:4443
      CDN_BASE_URL: http://localhost:4444/storage/v1/b/hisuiki-assets-prod/o
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      BETTER_AUTH_URL: http://localhost:8081
      BETTER_AUTH_SECRET: local-production-shaped-secret-not-used-anywhere-else
      AUTH_APP_NAME: Hisuiki (local)
      # Empty on purpose. Production scopes the cookie to .hisuiki.com so api. and the apex share it;
      # localhost has no parent domain to scope to, and setting one stops the cookie being stored.
      AUTH_COOKIE_DOMAIN: ""
      SITE_OWNER_EMAILS: dev@example.com

  web:
    restart: unless-stopped
    image: hisuiki-app:local
    build: *app-build
    depends_on:
      - api
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      APP_ROLE: web
      PORT: 8080

volumes:
  postgres-prod-data:
